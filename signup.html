<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign up | Ambition</title>
		<meta
			name="description"
			content="Create an Ambition account to manage projects."
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="apply-page login-page">
		<header class="site-header">
			<div class="container nav-bar">
				<a href="index.html" class="brand">
					<img src="LogoText.png" alt="Ambition Logo" class="brand-logo" />
				</a>
				<nav class="nav-links">
					<a href="about.html" class="nav-pill">About</a>
					<a href="index.html" class="nav-pill">Home</a>
				</nav>
			</div>
		</header>

		<main class="apply-main login-main">
			<section class="apply-intro login-intro">
				<p class="eyebrow">Project workspace</p>
				<h1>Create your account.</h1>
				<p>Set up your Ambition account to manage projects.</p>
			</section>

			<section class="apply-card login-card" aria-labelledby="signup-heading">
				<h2 id="signup-heading">Sign up</h2>
				<form id="signupForm" action="projects.html" method="get">
					<label for="name">
						Full name
						<input id="name" name="name" type="text" autocomplete="name" required />
					</label>

					<label for="email">
						Email address
						<input id="email" name="email" type="email" autocomplete="email" required />
					</label>

					<label for="password">
						Password
						<span class="password-field">
							<input id="password" name="password" type="password" autocomplete="new-password" required />
							<button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" title="Show password"><span aria-hidden="true">&#128065;</span></button>
						</span>
					</label>

					<label for="confirm-password">
						Confirm password
						<span class="password-field">
							<input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required />
							<button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password" title="Show password"><span aria-hidden="true">&#128065;</span></button>
						</span>
					</label>

					<label class="terms-agreement" for="signupTerms">
						<input id="signupTerms" name="terms_agreed" type="checkbox" required />
						<span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms and Conditions</a>.</span>
					</label>

					<div
						class="cf-turnstile"
						data-sitekey="0x4AAAAAAEXFCXtBoZFKN8dO"
						data-action="signup"
					></div>
					<p class="form-message" id="signupMessage" role="alert" aria-live="polite"></p>
					<button class="btn btn-primary" type="submit">Create account</button>
					<a class="login-link" href="login.html">Already have an account? Log in</a>
				</form>
			</section>
		</main>

		<footer class="site-footer">
			<div class="container footer-row">
				<p>© 2026 Ambition. Built for the next generation.</p>
				<a href="index.html">Back to home</a>
			</div>
		</footer>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="supabase-config.js"></script>
		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
		<script src="script.js"></script>
	</body>
</html>
